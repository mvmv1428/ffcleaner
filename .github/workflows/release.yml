name: Publicar versión

# Se ejecuta al subir una etiqueta vX.Y.Z (por ejemplo: git tag v0.4.0 && git push origin v0.4.0).
# La etiqueta debe coincidir con <Version> de Directory.Build.props.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      # Las versiones publicadas buscan sus actualizaciones en este mismo repositorio.
      FFCLEANER_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Comprobar que la etiqueta coincide con la versión
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'tools'); import project_info; print(project_info.version())"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "La etiqueta ${{ github.ref_name }} no coincide con la versión $version de Directory.Build.props." }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Pruebas del motor
        shell: pwsh
        run: |
          foreach ($t in 'CoreTests', 'CleaningTests', 'RegistryTests', 'RegistrySafetyTests', 'DesktopPolicyTests') {
            dotnet run --project "tests/$t" -c Release
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Paquete portable e instalador
        run: python tools/build_portable.py --replace

      - name: Huellas SHA-256
        shell: pwsh
        run: |
          foreach ($f in "dist/FFCleaner-$env:VERSION-win-x64.zip", "dist/FFCleaner-$env:VERSION-Setup.exe") {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $f -Leaf)" | Out-File -FilePath "$f.sha256" -Encoding ascii -NoNewline
          }

      - name: Crear la versión en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/FFCleaner-$env:VERSION-Setup.exe" "dist/FFCleaner-$env:VERSION-Setup.exe.sha256" `
            "dist/FFCleaner-$env:VERSION-win-x64.zip" "dist/FFCleaner-$env:VERSION-win-x64.zip.sha256" `
            --title "FFCleaner $env:VERSION" --generate-notes
